<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Club Card Manager Pro</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#38bdf8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        :root {
            --bg-dark: #0f172a; --card-bg: #1e293b; --yellow-card: #fbbf24;
            --red-card: #ef4444; --accent: #38bdf8; --white: #ffffff; 
            --archive: #a855f7; --warning: #f97316;
        }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg-dark); margin: 0; padding: 10px; color: var(--white); -webkit-tap-highlight-color: transparent; min-height: 100vh; display: flex; flex-direction: column; }
        .container { max-width: 100%; margin: auto; flex: 1; width: 100%; }
        
        .lang-switcher { display: flex; justify-content: center; gap: 20px; margin-bottom: 10px; }
        .flag-btn { font-size: 1.8rem; cursor: pointer; opacity: 0.4; transition: 0.3s; background: none; border: none; }
        .flag-btn.active { opacity: 1; transform: scale(1.1); }

        header { text-align: center; padding: 10px 0 20px 0; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .logo-container { width: 80px; height: 80px; cursor: pointer; transition: transform 0.2s; }
        .logo-club { width: 100%; height: 100%; object-fit: contain; border-radius: 8px; }

        #ui-title { margin:0; letter-spacing: 2px; text-transform: uppercase; font-size: 1.4rem; cursor: pointer; }

        .tabs { display: flex; gap: 5px; margin-bottom: 15px; }
        .tab-btn { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: white; font-weight: bold; cursor: pointer; }
        .tab-btn.active { background: var(--accent); color: var(--bg-dark); }

        .dashboard-controls { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 12px; margin-bottom: 15px; display: flex; flex-direction: column; gap: 10px; }
        input, select { padding: 12px; border-radius: 8px; background: #0f172a; border: 1px solid #334155; color: white; font-size: 16px; width: 100%; box-sizing: border-box; }
        
        .player-card { background: var(--card-bg); border-radius: 12px; padding: 15px; margin-bottom: 12px; border-left: 4px solid var(--accent); position: relative; }
        .stats-row { display: flex; justify-content: space-around; align-items: center; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px; margin-top: 10px; }
        
        .btn-card { width: 45px; height: 60px; border-radius: 5px; border: none; cursor: pointer; }
        .yellow { background: var(--yellow-card); }
        .red { background: var(--red-card); }

        .counter-box { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 5px; }
        .btn-minus { background: rgba(255,255,255,0.1); border: 1px solid #444; color: white; border-radius: 4px; width: 30px; height: 30px; font-weight: bold; }

        .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: bold; text-transform: uppercase; }
        .status-suspended { background: var(--red-card); }
        .status-warning { background: var(--warning); }
        .status-ok { background: #16a34a; }

        .admin-zone { margin-top: 30px; padding: 15px; border: 1px dashed #444; border-radius: 12px; display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
        .btn-action { padding: 12px; border-radius: 8px; border: none; font-weight: bold; color: white; cursor: pointer; width: 100%; }

        footer { text-align: center; padding: 20px 0; border-top: 1px solid #1e293b; color: #64748b; font-size: 0.75rem; }
    </style>
</head>
<body>

<div class="container">
    <div class="lang-switcher">
        <button id="btn-fr" class="flag-btn active" onclick="setLang('fr')">🇫🇷</button>
        <button id="btn-en" class="flag-btn" onclick="setLang('en')">🇬🇧</button>
        <button id="btn-nl" class="flag-btn" onclick="setLang('nl')">🇳🇱</button>
    </div>

    <header>
        <div class="logo-container" onclick="document.getElementById('logoInput').click()">
            <img id="clubLogoImg" src="https://img.icons8.com/color/96/football-shirt.png" alt="Logo" class="logo-club">
            <input type="file" id="logoInput" style="display:none" accept="image/*" onchange="updateLogo(event)">
        </div>
        <div>
            <h2 id="ui-title" onclick="editClubName()">R.U.S. BIESME</h2>
            <div id="ui-subtitle" style="font-size: 0.7rem; color: var(--accent); text-transform: uppercase;"></div>
        </div>
    </header>

    <div class="tabs">
        <button id="tabLive" class="tab-btn active" onclick="switchTab('live')"></button>
        <button id="tabArchive" class="tab-btn" onclick="switchTab('archive')"></button>
    </div>

    <div id="viewLive">
        <div class="dashboard-controls">
            <select id="teamSelect" onchange="render()">
                <optgroup label="Séniors">
                    <option value="A">P1 (A)</option>
                    <option value="B">P3 (B)</option>
                </optgroup>
                <optgroup label="Jeunes">
                    <option value="U21">U21</option><option value="U19">U19</option><option value="U17">U17</option>
                    <option value="U16">U16</option><option value="U15">U15</option><option value="U14">U14</option>
                    <option value="U13">U13</option>
                </optgroup>
            </select>
            <select id="modeSelect" onchange="render()">
                <option value="champ">Championnat / Championship</option>
                <option value="coupe">Coupe / Cup</option>
            </select>
            <div style="display:flex; gap:5px;">
                <input type="text" id="newName" placeholder="" style="flex:3">
                <button id="ui-add-btn" onclick="addPlayer()" style="background:var(--accent); border:none; padding:0 15px; border-radius:8px; font-weight:bold; color:var(--bg-dark)"></button>
            </div>
        </div>
        
        <div id="playerList"></div>
        
        <div class="admin-zone">
            <button id="ui-archive-btn" class="btn-action" style="background:var(--archive)" onclick="archiveSaison()"></button>
            <button id="ui-export-btn" class="btn-action" style="background:#16a34a" onclick="exportData()"></button>
            <button class="btn-action" style="background:#475569" onclick="document.getElementById('importFile').click()">📥 IMPORT BACKUP</button>
            <input type="file" id="importFile" style="display:none" onchange="importData(event)">
        </div>
    </div>

    <div id="viewArchive" style="display:none;">
        <div id="archiveContent"></div>
    </div>
</div>

<footer id="ui-footer"></footer>

<script>
    // PWA Service Worker Registration
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').catch(err => console.log(err));
        });
    }

    const translations = {
        fr: {
            subtitle: "Portail de Gestion Officiel", direct: "DIRECT", archives: "ARCHIVES", add: "AJOUTER", 
            placeholder: "Nom du joueur...", champ: "Championnat", coupe: "Coupe", danger: "⚠️ EN DANGER", 
            suspended: "SUSPENDU", toPurge: "À PURGER", archiveBtn: "📦 ARCHIVER LA SAISON", 
            exportBtn: "💾 SAUVEGARDER", deleteConfirm: "Supprimer", editClub: "Nom du club :",
            footer: "Développé par Philippe BOUNAMEAU"
        },
        en: {
            subtitle: "Official Management Portal", direct: "LIVE", archives: "ARCHIVES", add: "ADD", 
            placeholder: "Player name...", champ: "Championship", coupe: "Cup", danger: "⚠️ AT RISK", 
            suspended: "SUSPENDED", toPurge: "TO PURGE", archiveBtn: "📦 ARCHIVE SEASON", 
            exportBtn: "💾 SAVE BACKUP", deleteConfirm: "Delete", editClub: "Club name:",
            footer: "Developed by Philippe BOUNAMEAU"
        },
        nl: {
            subtitle: "Officieel Beheerportaal", direct: "LIVE", archives: "ARCHIEVEN", add: "TOEVOEGEN", 
            placeholder: "Naam speler...", champ: "Kampioenschap", coupe: "Beker", danger: "⚠️ IN GEVAAR", 
            suspended: "GESCHORST", toPurge: "UIT TE ZITTEN", archiveBtn: "📦 SEIZOEN ARCHIVEREN", 
            exportBtn: "💾 BACK-UP OPSLAAN", deleteConfirm: "Verwijderen", editClub: "Clubnaam:",
            footer: "Ontwikkeld door Philippe BOUNAMEAU"
        }
    };

    let currentLang = localStorage.getItem('biesme_lang') || 'fr';
    let clubName = localStorage.getItem('biesme_club_name') || 'R.U.S. BIESME';
    let clubLogo = localStorage.getItem('biesme_club_logo') || 'https://img.icons8.com/color/96/football-shirt.png';
    let players = JSON.parse(localStorage.getItem('biesme_v33_db')) || [];
    let archives = JSON.parse(localStorage.getItem('biesme_v33_history')) || {};

    function updateLogo(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                clubLogo = e.target.result;
                localStorage.setItem('biesme_club_logo', clubLogo);
                document.getElementById('clubLogoImg').src = clubLogo;
            };
            reader.readAsDataURL(file);
        }
    }

    function editClubName() {
        const newName = prompt(translations[currentLang].editClub, clubName);
        if (newName && newName.trim() !== "") {
            clubName = newName.trim().toUpperCase();
            localStorage.setItem('biesme_club_name', clubName);
            render();
        }
    }

    function setLang(lang) {
        currentLang = lang;
        localStorage.setItem('biesme_lang', lang);
        document.querySelectorAll('.flag-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-' + lang).classList.add('active');
        render();
    }

    function switchTab(type) {
        document.getElementById('viewLive').style.display = type === 'live' ? 'block' : 'none';
        document.getElementById('viewArchive').style.display = type === 'archive' ? 'block' : 'none';
        document.getElementById('tabLive').className = 'tab-btn' + (type === 'live' ? ' active' : '');
        document.getElementById('tabArchive').className = 'tab-btn' + (type === 'archive' ? ' active' : '');
        render();
    }

    function addPlayer() {
        const input = document.getElementById('newName');
        if (!input.value.trim()) return;
        players.push({ id: Date.now(), name: input.value.trim().toUpperCase(), team: document.getElementById('teamSelect').value, logs: [], susp: 0 });
        input.value = ""; save();
    }

    function updateCard(playerId, type, delta) {
        const p = players.find(x => x.id === playerId);
        const mode = document.getElementById('modeSelect').value;
        if (delta > 0) {
            p.logs.push({ type, mode, date: new Date().toLocaleDateString() });
            if(type === 'r') p.susp = Math.max(p.susp, 1);
        } else {
            const idx = p.logs.findLastIndex(l => l.type === type && l.mode === mode);
            if (idx !== -1) p.logs.splice(idx, 1);
        }
        save();
    }

    function updateSusp(id, v) {
        const p = players.find(x => x.id === id);
        p.susp = Math.max(0, p.susp + v);
        save();
    }

    function save() {
        localStorage.setItem('biesme_v33_db', JSON.stringify(players));
        localStorage.setItem('biesme_v33_history', JSON.stringify(archives));
        render();
    }

    function render() {
        const t = translations[currentLang];
        document.getElementById('clubLogoImg').src = clubLogo;
        document.getElementById('ui-title').innerText = clubName;
        document.getElementById('ui-subtitle').innerText = t.subtitle;
        document.getElementById('tabLive').innerText = t.direct;
        document.getElementById('tabArchive').innerText = t.archives;
        document.getElementById('newName').placeholder = t.placeholder;
        document.getElementById('ui-add-btn').innerText = t.add;
        document.getElementById('ui-archive-btn').innerText = t.archiveBtn;
        document.getElementById('ui-export-btn').innerText = t.exportBtn;
        document.getElementById('ui-footer').innerText = "© 2024-2026 " + clubName + " | " + t.footer;

        const list = document.getElementById('playerList');
        const team = document.getElementById('teamSelect').value;
        const mode = document.getElementById('modeSelect').value;
        list.innerHTML = "";

        players.filter(p => p.team === team).sort((a,b) => a.name.localeCompare(b.name)).forEach(p => {
            const modeLogs = p.logs.filter(l => l.mode === mode);
            const y = modeLogs.filter(l => l.type === 'y').length;
            const r = modeLogs.filter(l => l.type === 'r').length;
            const isSuspended = (r > 0 || (mode === 'champ' && y >= 3) || (mode === 'coupe' && y >= 2) || p.susp > 0);
            const isAtRisk = (!isSuspended && ((mode === 'champ' && y === 2) || (mode === 'coupe' && y === 1)));

            list.innerHTML += `
                <div class="player-card" style="border-left-color: ${isSuspended ? 'var(--red-card)' : isAtRisk ? 'var(--warning)' : 'var(--accent)'}">
                    <button onclick="if(confirm('${t.deleteConfirm}?')) {players=players.filter(x=>x.id!=${p.id});save();}" style="position:absolute; right:10px; top:10px; background:none; border:none; color:#666; font-size:1.2rem;">×</button>
                    <div style="display:flex; justify-content:space-between; align-items:center; padding-right:25px;">
                        <span><strong>${p.name}</strong></span>
                        <span class="badge ${isSuspended?'status-suspended':isAtRisk?'status-warning':'status-ok'}">
                            ${isSuspended ? t.suspended : isAtRisk ? t.danger : 'OK'}
                        </span>
                    </div>
                    <div class="stats-row">
                        <div style="text-align:center">
                            <button class="btn-card yellow" onclick="updateCard(${p.id},'y',1)"></button>
                            <div class="counter-box"><button class="btn-minus" onclick="updateCard(${p.id},'y',-1)">-</button><b>${y}</b></div>
                        </div>
                        <div style="text-align:center">
                            <button class="btn-card red" onclick="updateCard(${p.id},'r',1)"></button>
                            <div class="counter-box"><button class="btn-minus" onclick="updateCard(${p.id},'r',-1)">-</button><b>${r}</b></div>
                        </div>
                        <div style="text-align:center; border-left:1px solid #444; padding-left:10px;">
                            <div style="font-size:0.55rem; color:var(--accent);">${t.toPurge}</div>
                            <button class="btn-minus" onclick="updateSusp(${p.id},-1)">-</button><b>${p.susp}</b><button class="btn-minus" onclick="updateSusp(${p.id},1)">+</button>
                        </div>
                    </div>
                </div>`;
        });
    }

    function archiveSaison() {
        const nom = prompt("Saison :");
        if (!nom) return;
        archives[nom] = JSON.parse(JSON.stringify(players));
        players = players.map(p => ({ ...p, logs: [], susp: 0 }));
        save();
    }

    function exportData() {
        const blob = new Blob([JSON.stringify({current: players, history: archives, club: clubName, logo: clubLogo})], {type: "application/json"});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `${clubName.replace(/\s+/g, '_')}_backup.json`;
        a.click();
    }

    function importData(event) {
        const reader = new FileReader();
        reader.onload = (e) => {
            const data = JSON.parse(e.target.result);
            players = data.current; archives = data.history;
            if(data.club) clubName = data.club;
            if(data.logo) clubLogo = data.logo;
            save(); location.reload();
        };
        reader.readAsText(event.target.files[0]);
    }

    setLang(currentLang);
</script>
</body>
</html>
